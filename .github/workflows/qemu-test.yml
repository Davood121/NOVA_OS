name: qemu-test

on: [push, workflow_dispatch]

jobs:
  bios-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86

      - name: Build (QEMU exit hook enabled)
        run: make QEMU_EXIT=1

      - name: BIOS boot test
        run: |
          set +e
          timeout 60 qemu-system-i386 -fda grid-os.img -display none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ $code -eq 33 ]; then
            echo "PASS: kernel booted, init ran, reached shell"
          else
            echo "FAIL: kernel did not reach the boot-ok point"
            exit 1
          fi

  uefi-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain, QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86 ovmf mtools dosfstools

      - name: Build UEFI loader
        run: make QEMU_EXIT=1 uefi

      - name: UEFI boot test (OVMF)
        run: |
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "OVMF code: $CODE / vars: $VARS"
          test -n "$CODE" && test -n "$VARS"
          dd if=/dev/zero of=/tmp/disk.img bs=1M count=64
          printf 'label: gpt\nstart=2048, type=C12A7328-F81F-11D2-BA4B-00A0C93EC93B\n' | sfdisk /tmp/disk.img
          mkfs.vfat -F 32 --offset 2048 /tmp/disk.img
          mmd -i /tmp/disk.img@@1048576 ::/EFI
          mmd -i /tmp/disk.img@@1048576 ::/EFI/BOOT
          mcopy -i /tmp/disk.img@@1048576 build/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mdir -i /tmp/disk.img@@1048576 ::/EFI/BOOT
          cp "$VARS" /tmp/vars.fd
          set +e
          timeout 90 qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file=$CODE \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -drive format=raw,file=/tmp/disk.img \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01 \
            -serial file:/tmp/serial.log \
            -debugcon file:/tmp/ovmf.log -global isa-debugcon.iobase=0x402 \
            -display none -no-reboot -net none
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ $code -eq 33 ]; then
            echo "PASS: UEFI handoff to kernel works"
          elif [ $code -eq 65 ]; then
            echo "FAIL: loader ran but ExitBootServices failed"
            tail -20 /tmp/ovmf.log || true
            exit 1
          else
            echo "FAIL: firmware never reached the loader (code $code)"
            tail -30 /tmp/ovmf.log || true
            tail -10 /tmp/serial.log || true
            exit 1
          fi

      - name: Upload firmware logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-debug-logs
          path: |
            /tmp/ovmf.log
            /tmp/serial.log
          if-no-files-found: ignore

  graphics-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86

      - name: Build (interactive, no exit hook)
        run: make

      - name: Drive graphics demo over QMP and verify pixels
        run: |
          set -e
          qemu-system-i386 -fda grid-os.img -display none -no-reboot -net none \
            -qmp unix:/tmp/qmp.sock,server,nowait > /tmp/qemu.out 2>&1 &
          QPID=$!
          python3 - <<'PYEOF'
          import socket, json, time

          class QMP:
              def __init__(self, path):
                  self.s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  self.s.connect(path)
                  self.f = self.s.makefile('rw')
                  json.loads(self.f.readline())
                  self.cmd('qmp_capabilities')
              def cmd(self, name, **args):
                  self.f.write(json.dumps({'execute': name, 'arguments': args}) + '\n')
                  self.f.flush()
                  while True:
                      line = json.loads(self.f.readline())
                      if 'return' in line or 'error' in line:
                          return line

          q = QMP('/tmp/qmp.sock')
          time.sleep(3)
          for key in ['d', 'e', 'm', 'o', 'ret']:
              q.cmd('send-key', keys=[{'type': 'qcode', 'data': key}])
              time.sleep(0.2)
          time.sleep(3)
          q.cmd('screendump', filename='/tmp/gfx.ppm')
          time.sleep(1)
          q.cmd('send-key', keys=[{'type': 'qcode', 'data': 'q'}])
          time.sleep(2)
          q.cmd('screendump', filename='/tmp/text.ppm')
          time.sleep(0.5)
          q.cmd('quit')
          PYEOF
          wait $QPID || true
          python3 - <<'PYEOF'
          def load_ppm(path):
              with open(path, 'rb') as f:
                  assert f.readline().strip() == b'P6'
                  line = f.readline()
                  while line.startswith(b'#'):
                      line = f.readline()
                  w, h = map(int, line.split())
                  f.readline()
                  return w, h, f.read(w * h * 3)

          w, h, px = load_ppm('/tmp/gfx.ppm')
          assert (w, h) in ((320, 200), (640, 400)), 'bad mode-13h size: %s' % ((w, h),)
          sx, sy = w // 320, h // 200
          def pix(x, y):
              i = ((y * sy + sy // 2) * w + (x * sx + sx // 2)) * 3
              return px[i], px[i + 1], px[i + 2]
          checks = [
              ((10, 4),   (0, 0, 0)),      # palette block 0: black
              ((210, 4),  (0, 170, 0)),    # block 10: light green
              ((290, 4),  (170, 170, 0)),  # block 14: yellow
              ((20, 16),  (170, 0, 0)),    # accent rect: light red
          ]
          for (x, y), exp in checks:
              got = pix(x, y)
              assert got == exp, 'pixel (%d,%d): got %s want %s' % (x, y, got, exp)
          colors = {px[i:i + 3] for i in range(0, len(px), 3)}
          assert len(colors) >= 64, 'too few distinct colors: %d' % len(colors)
          tw, th, _ = load_ppm('/tmp/text.ppm')
          assert (tw, th) == (720, 400), 'text mode not restored: %dx%d' % (tw, th)
          print('GFX OK: mode 13h %dx%d, %d colors, pixel checks passed; text mode restored %dx%d' % (w, h, len(colors), tw, th))
          PYEOF

      - name: Upload screendumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx-screendumps
          path: |
            /tmp/gfx.ppm
            /tmp/text.ppm
          if-no-files-found: ignore
