name: qemu-test

on: [push, workflow_dispatch]

jobs:
  bios-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86

      - name: Build (QEMU exit hook enabled)
        run: make QEMU_EXIT=1

      - name: BIOS boot test
        run: |
          set +e
          timeout 60 qemu-system-i386 -fda grid-os.img -display none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ $code -eq 33 ]; then
            echo "PASS: kernel booted, init ran, reached shell"
          else
            echo "FAIL: kernel did not reach the boot-ok point"
            exit 1
          fi

  uefi-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain, QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86 ovmf mtools dosfstools

      - name: Build UEFI loader
        run: make QEMU_EXIT=1 uefi

      - name: UEFI boot test (OVMF)
        run: |
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "OVMF code: $CODE / vars: $VARS"
          test -n "$CODE" && test -n "$VARS"
          dd if=/dev/zero of=/tmp/disk.img bs=1M count=64
          printf 'label: gpt\nstart=2048, type=C12A7328-F81F-11D2-BA4B-00A0C93EC93B\n' | sfdisk /tmp/disk.img
          mkfs.vfat -F 32 --offset 2048 /tmp/disk.img
          mmd -i /tmp/disk.img@@1048576 ::/EFI
          mmd -i /tmp/disk.img@@1048576 ::/EFI/BOOT
          mcopy -i /tmp/disk.img@@1048576 build/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mdir -i /tmp/disk.img@@1048576 ::/EFI/BOOT
          cp "$VARS" /tmp/vars.fd
          set +e
          timeout 90 qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file=$CODE \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -drive format=raw,file=/tmp/disk.img \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01 \
            -serial file:/tmp/serial.log \
            -debugcon file:/tmp/ovmf.log -global isa-debugcon.iobase=0x402 \
            -display none -no-reboot -net none
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ $code -eq 33 ]; then
            echo "PASS: UEFI handoff to kernel works"
          elif [ $code -eq 65 ]; then
            echo "FAIL: loader ran but ExitBootServices failed"
            tail -20 /tmp/ovmf.log || true
            exit 1
          else
            echo "FAIL: firmware never reached the loader (code $code)"
            tail -30 /tmp/ovmf.log || true
            tail -10 /tmp/serial.log || true
            exit 1
          fi

      - name: Upload firmware logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-debug-logs
          path: |
            /tmp/ovmf.log
            /tmp/serial.log
          if-no-files-found: ignore

  graphics-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86

      - name: Build (interactive, no exit hook)
        run: make

      - name: Drive graphics demo over QMP and verify pixels
        run: |
          set -e
          qemu-system-i386 -fda grid-os.img -display none -no-reboot -net none \
            -qmp unix:/tmp/qmp.sock,server,nowait > /tmp/qemu.out 2>&1 &
          QPID=$!
          python3 - <<'PYEOF'
          import socket, json, time

          class QMP:
              def __init__(self, path):
                  self.s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  self.s.connect(path)
                  self.f = self.s.makefile('rw')
                  json.loads(self.f.readline())
                  self.cmd('qmp_capabilities')
              def cmd(self, name, **args):
                  self.f.write(json.dumps({'execute': name, 'arguments': args}) + '\n')
                  self.f.flush()
                  while True:
                      line = json.loads(self.f.readline())
                      if 'return' in line or 'error' in line:
                          return line

          q = QMP('/tmp/qmp.sock')
          time.sleep(3)
          for key in ['d', 'e', 'm', 'o', 'ret']:
              q.cmd('send-key', keys=[{'type': 'qcode', 'data': key}])
              time.sleep(0.2)
          time.sleep(3)
          q.cmd('screendump', filename='/tmp/gfx.ppm')
          time.sleep(1)
          q.cmd('send-key', keys=[{'type': 'qcode', 'data': 'q'}])
          time.sleep(2)
          q.cmd('screendump', filename='/tmp/text.ppm')
          time.sleep(0.5)
          for key in ['t', 'e', 'x', 't', 'ret']:
              q.cmd('send-key', keys=[{'type': 'qcode', 'data': key}])
              time.sleep(0.2)
          time.sleep(3)
          q.cmd('screendump', filename='/tmp/gfxtext.ppm')
          time.sleep(1)
          q.cmd('send-key', keys=[{'type': 'qcode', 'data': 'q'}])
          time.sleep(2)
          q.cmd('screendump', filename='/tmp/text2.ppm')
          time.sleep(0.5)
          q.cmd('quit')
          PYEOF
          wait $QPID || true
          python3 - <<'PYEOF'
          def load_ppm(path):
              with open(path, 'rb') as f:
                  assert f.readline().strip() == b'P6'
                  line = f.readline()
                  while line.startswith(b'#'):
                      line = f.readline()
                  w, h = map(int, line.split())
                  f.readline()
                  return w, h, f.read(w * h * 3)
          
          # Mode 13h on QEMU std VGA: non-VBE bpp is 0, so QEMU renders through the
          # VGA_DRAW_LINE8D2 double-dotted path: the screendump surface is 512x400,
          # each framebuffer byte becomes a 2x2 pixel block, and only FB columns 0-255
          # are shown. FB(x, y) appears at surface(2x, 2y).
          #
          # Color = the vgabios default DAC entry indexed by the FB byte: bytes 0-63
          # index the 64-color default palette below, bytes 64-255 hit DAC entries
          # zeroed by vgabios (black). 6-bit DAC components are scaled
          # c6_to_8(v) = (v<<2)|(b<<1)|b, e.g. 21 -> 87, 42 -> 168.
          # Table derived from a screendump of this exact demo and cross-checked on
          # two independent framebuffer rows for all 256 values.
          PAL = [
              (0,0,0),(0,0,168),(0,168,0),(0,168,168),(168,0,0),(168,0,168),
              (168,168,0),(168,168,168),(0,0,87),(0,0,255),(0,168,87),(0,168,255),
              (168,0,87),(168,0,255),(168,168,87),(168,168,255),
              (0,87,0),(0,87,168),(0,255,0),(0,255,168),(168,87,0),(168,87,168),
              (168,255,0),(168,255,168),(0,87,87),(0,87,255),(0,255,87),(0,255,255),
              (168,87,87),(168,87,255),(168,255,87),(168,255,255),
              (87,0,0),(87,0,168),(87,168,0),(87,168,168),(255,0,0),(255,0,168),
              (255,168,0),(255,168,168),(87,0,87),(87,0,255),(87,168,87),(87,168,255),
              (255,0,87),(255,0,255),(255,168,87),(255,168,255),
              (87,87,0),(87,87,168),(87,255,0),(87,255,168),(255,87,0),(255,87,168),
              (255,255,0),(255,255,168),(87,87,87),(87,87,255),(87,255,87),(87,255,255),
              (255,87,87),(255,87,255),(255,255,87),(255,255,255),
          ]
          
          def fbval(x, y):
              # exact replica of gfx_demo_draw()
              if 10 <= x < 50 and 12 <= y < 24:
                  return 0x0C                      # accent rect
              if y < 8:
                  return x // 20                   # 16-color palette bar
              return (x ^ y) & 0xFF                # xor gradient
          
          w, h, px = load_ppm('/tmp/gfx.ppm')
          assert (w, h) == (512, 400), 'bad mode-13h surface: %dx%d' % (w, h)
          
          def spix(x, y):
              i = (y * 2 * w + x * 2) * 3
              return px[i], px[i + 1], px[i + 2]
          
          # verify EVERY visible pixel (FB x 0-255, y 0-199) against the expected
          # demo picture: 51200 pixel probes, starting with the palette bar and the
          # accent rect, then the full xor gradient
          bad = []
          for y in range(200):
              for x in range(256):
                  v = fbval(x, y)
                  want = PAL[v] if v < 64 else (0, 0, 0)
                  if spix(x, y) != want:
                      bad.append((x, y, spix(x, y), want))
          assert not bad, 'mismatched pixels (first 5): %s' % (bad[:5],)
          assert not any(c == (0, 0, 0) for c in PAL[1:]), 'palette degenerated'
          
          tw, th, _ = load_ppm('/tmp/text.ppm')
          assert (tw, th) == (720, 400), 'text mode not restored: %dx%d' % (tw, th)
          print('GFX OK: 51200/51200 pixels match expected demo picture; text mode restored %dx%d' % (tw, th))
          
          # v0.8: bitmap-font text screen (shell `text` command). Verifier replicates
          # gfx_text_demo() using the same font rows. fg pixels only are drawn on top
          # of a solid 0x01 (blue) background fill.
          F = {
              ' ': [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00],
              '0': [0x3E,0x63,0x73,0x7B,0x6F,0x67,0x3E,0x00],
              '1': [0x0C,0x0E,0x0C,0x0C,0x0C,0x0C,0x3F,0x00],
              '2': [0x1E,0x33,0x30,0x1C,0x06,0x33,0x3F,0x00],
              '3': [0x1E,0x33,0x30,0x1C,0x30,0x33,0x1E,0x00],
              '4': [0x38,0x3C,0x36,0x33,0x7F,0x30,0x78,0x00],
              '5': [0x3F,0x03,0x1F,0x30,0x30,0x33,0x1E,0x00],
              '6': [0x1C,0x06,0x03,0x1F,0x33,0x33,0x1E,0x00],
              '7': [0x3F,0x33,0x30,0x18,0x0C,0x0C,0x0C,0x00],
              '8': [0x1E,0x33,0x33,0x1E,0x33,0x33,0x1E,0x00],
              '9': [0x1E,0x33,0x33,0x3E,0x30,0x18,0x0E,0x00],
              'A': [0x0C,0x1E,0x33,0x33,0x3F,0x33,0x33,0x00],
              'B': [0x3F,0x66,0x66,0x3E,0x66,0x66,0x3F,0x00],
              'C': [0x3C,0x66,0x03,0x03,0x03,0x66,0x3C,0x00],
              'D': [0x1F,0x36,0x66,0x66,0x66,0x36,0x1F,0x00],
              'E': [0x7F,0x46,0x16,0x1E,0x16,0x46,0x7F,0x00],
              'F': [0x7F,0x46,0x16,0x1E,0x16,0x06,0x0F,0x00],
              'G': [0x3C,0x66,0x03,0x03,0x73,0x66,0x7C,0x00],
              'I': [0x1E,0x0C,0x0C,0x0C,0x0C,0x0C,0x1E,0x00],
              'O': [0x1C,0x36,0x63,0x63,0x63,0x36,0x1C,0x00],
              'R': [0x3F,0x66,0x66,0x3E,0x36,0x66,0x67,0x00],
              'S': [0x1E,0x33,0x07,0x0E,0x38,0x33,0x1E,0x00],
              'c': [0x00,0x00,0x1E,0x33,0x03,0x33,0x1E,0x00],
              'e': [0x00,0x00,0x1E,0x33,0x3F,0x03,0x1E,0x00],
              'g': [0x00,0x00,0x6E,0x33,0x33,0x3E,0x30,0x1F],
              'h': [0x07,0x06,0x36,0x6E,0x66,0x66,0x67,0x00],
              'i': [0x0C,0x00,0x0E,0x0C,0x0C,0x0C,0x1E,0x00],
              'm': [0x00,0x00,0x33,0x7F,0x7F,0x6B,0x63,0x00],
              'n': [0x00,0x00,0x1F,0x33,0x33,0x33,0x33,0x00],
              'o': [0x00,0x00,0x1E,0x33,0x33,0x33,0x1E,0x00],
              'p': [0x00,0x00,0x3B,0x66,0x66,0x3E,0x06,0x0F],
              'r': [0x00,0x00,0x3B,0x6E,0x66,0x06,0x0F,0x00],
              's': [0x00,0x00,0x3E,0x03,0x1E,0x30,0x1F,0x00],
              't': [0x08,0x0C,0x3E,0x0C,0x0C,0x2C,0x18,0x00],
              'u': [0x00,0x00,0x33,0x33,0x33,0x33,0x6E,0x00],
              'v': [0x00,0x00,0x33,0x33,0x33,0x1E,0x0C,0x00],
              'y': [0x00,0x00,0x33,0x33,0x33,0x3E,0x30,0x1F],
          }
          # same font rows as src/kernel/font.h; bit 0 of each row byte = leftmost pixel
          LINES = [
              (24, 104, 2, 'GRID OS', 0x0F),
              (80, 84, 1, 'everything computes', 0x0E),
              (120, 96, 1, '0123456789ABCDEF', 0x0A),
          ]
          
          def fbtext(x, y):
              for y0, x0, sc, txt, col in LINES:
                  n = len(txt)
                  if y0 <= y < y0 + 8 * sc and x0 <= x < x0 + 8 * sc * n:
                      rows = F[txt[(x - x0) // (8 * sc)]]
                      gy = (y - y0) // sc
                      gx = ((x - x0) // sc) & 7
                      if rows[gy] & (1 << gx):
                          return col
              return 0x01
          
          tw2, th2, tx = load_ppm('/tmp/gfxtext.ppm')
          assert (tw2, th2) == (512, 400), 'bad text-demo surface: %dx%d' % (tw2, th2)
          
          def tpix(x, y):
              i = (y * 2 * tw2 + x * 2) * 3
              return tx[i], tx[i + 1], tx[i + 2]
          
          bad2 = []
          for y in range(200):
              for x in range(256):
                  v = fbtext(x, y)
                  want = PAL[v] if v < 64 else (0, 0, 0)
                  if tpix(x, y) != want:
                      bad2.append((x, y, tpix(x, y), want))
          assert not bad2, 'text demo mismatched pixels (first 5): %s' % (bad2[:5],)
          
          colors2 = {tx[i:i + 3] for i in range(0, len(tx), 3)}
          assert len(colors2) >= 4, 'text screen degenerated: %d colors' % len(colors2)
          
          tw3, th3, _ = load_ppm('/tmp/text2.ppm')
          assert (tw3, th3) == (720, 400), 'text mode not restored after text demo: %dx%d' % (tw3, th3)
          print('TEXT OK: 51200/51200 pixels of the font/text demo match; text mode restored again %dx%d' % (tw3, th3))
          PYEOF

      - name: Upload screendumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfx-screendumps
          path: |
            /tmp/gfx.ppm
            /tmp/text.ppm
            /tmp/gfxtext.ppm
            /tmp/text2.ppm
          if-no-files-found: ignore
