name: qemu-test

on: [push, workflow_dispatch]

jobs:
  bios-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86

      - name: Build (QEMU exit hook enabled)
        run: make QEMU_EXIT=1

      - name: BIOS boot test
        run: |
          set +e
          timeout 60 qemu-system-i386 -fda grid-os.img -display none -no-reboot \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ $code -eq 33 ]; then
            echo "PASS: kernel booted, init ran, reached shell"
          else
            echo "FAIL: kernel did not reach the boot-ok point"
            exit 1
          fi

  uefi-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain, QEMU, OVMF, mtools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib qemu-system-x86 ovmf mtools dosfstools

      - name: Build UEFI loader
        run: make QEMU_EXIT=1 uefi

      - name: UEFI boot test (OVMF)
        run: |
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "OVMF code: $CODE / vars: $VARS"
          test -n "$CODE" && test -n "$VARS"
          dd if=/dev/zero of=/tmp/disk.img bs=1M count=64
          sfdisk /tmp/disk.img <<'EOF'
label: gpt
start=2048, size=129024, type=C12A7328-F81F-11D2-BA4B-00A0C93EC93B
EOF
          mkfs.vfat -F 32 --offset 2048 /tmp/disk.img
          mmd -i /tmp/disk.img@@1048576 ::/EFI
          mmd -i /tmp/disk.img@@1048576 ::/EFI/BOOT
          mcopy -i /tmp/disk.img@@1048576 build/BOOTX64.EFI ::/EFI/BOOT/BOOTX64.EFI
          mdir -i /tmp/disk.img@@1048576 ::/EFI/BOOT
          cp "$VARS" /tmp/vars.fd
          set +e
          timeout 90 qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file=$CODE \
            -drive if=pflash,format=raw,file=/tmp/vars.fd \
            -drive format=raw,file=/tmp/disk.img \
            -device isa-debug-exit,iobase=0xf4,iosize=0x01 \
            -serial file:/tmp/serial.log \
            -debugcon file:/tmp/ovmf.log -global isa-debugcon.iobase=0x402 \
            -display none -no-reboot -net none
          code=$?
          set -e
          echo "qemu exit code: $code"
          if [ $code -eq 33 ]; then
            echo "PASS: UEFI handoff to kernel works"
          elif [ $code -eq 65 ]; then
            echo "FAIL: loader ran but ExitBootServices failed"
            tail -20 /tmp/ovmf.log || true
            exit 1
          else
            echo "FAIL: firmware never reached the loader (code $code)"
            tail -30 /tmp/ovmf.log || true
            tail -10 /tmp/serial.log || true
            exit 1
          fi

      - name: Upload firmware logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-debug-logs
          path: |
            /tmp/ovmf.log
            /tmp/serial.log
          if-no-files-found: ignore
